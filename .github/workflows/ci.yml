name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bunx next typegen
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 1

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=arifinoid --branch=main --commit-dirty=true

  deploy-vps:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Each commit lands in its own release directory, so a half-finished
      # upload never replaces the live site.
      - name: Upload release
        run: |
          rsync -az --delete out/ "root@${{ secrets.VPS_HOST }}:/var/www/arifinoid/releases/${{ github.sha }}/"

      # Symlink swap is atomic; nginx keeps serving the old release until then.
      # Only the three newest releases are kept.
      - name: Activate release
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" '
            set -eu
            ln -sfn /var/www/arifinoid/releases/${{ github.sha }} /var/www/arifinoid/current.new
            mv -Tf /var/www/arifinoid/current.new /var/www/arifinoid/current
            ls -1dt /var/www/arifinoid/releases/*/ | tail -n +4 | xargs -r rm -rf
          '
